version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile:  ./cicd/local/Dockerfile
    container_name: smart-parking-api
    ports:
      - '3000:3000'
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - maul-networks


networks:
  maul-networks:
    external: true